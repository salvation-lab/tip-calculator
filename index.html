<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tip Calculator</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #e8eef5;
      --glow: #99f6e4;
      --card: #ffffff;
      --muted: #64748b;
      --text: #0f172a;
      --accent: #0d9488;
      --accent-text: #042f2e;
      --input: #f1f5f9;
      --border: #dbe3ee;
      --error: #b91c1c;
      --shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0f172a;
      --glow: #134e4a;
      --card: #1e293b;
      --muted: #94a3b8;
      --text: #f8fafc;
      --accent: #14b8a6;
      --accent-text: #042f2e;
      --input: #0f172a;
      --border: #334155;
      --error: #fca5a5;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    html {
      background-color: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(circle at top, var(--glow) 0%, transparent 45%),
        var(--bg);
      color: var(--text);
      padding: 24px;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .card {
      width: min(420px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      box-shadow: var(--shadow);
    }

    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
    }

    .theme-toggle {
      flex-shrink: 0;
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--input);
      color: var(--text);
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .theme-toggle:hover,
    .theme-toggle:focus-visible {
      border-color: var(--accent);
      outline: none;
    }

    .theme-toggle .icon-moon { display: none; }
    html[data-theme="dark"] .theme-toggle .icon-sun { display: none; }
    html[data-theme="dark"] .theme-toggle .icon-moon { display: block; }

    h1 {
      margin: 0 0 6px;
      font-size: 1.6rem;
    }

    p.subtitle {
      margin: 0 0 24px;
      color: var(--muted);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    input[type="number"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--input);
      color: var(--text);
      font-size: 1.1rem;
      outline: none;
    }

    input[type="number"]:focus {
      border-color: var(--accent);
    }

    .field {
      margin-bottom: 18px;
    }

    .tips {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .tips button {
      padding: 10px 0;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--input);
      color: var(--text);
      cursor: pointer;
      font-weight: 600;
    }

    .tips button.active,
    .tips button:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
    }

    .results {
      margin-top: 8px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      display: grid;
      gap: 10px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .row span {
      color: var(--muted);
    }

    .row strong {
      font-size: 1.25rem;
    }

    .error {
      min-height: 1.2em;
      color: var(--error);
      font-size: 0.85rem;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="header">
      <h1>Tip Calculator</h1>
      <button type="button" class="theme-toggle" id="themeToggle" aria-label="Switch to dark mode" title="Toggle dark mode">
        <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
        </svg>
        <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"></path>
        </svg>
      </button>
    </div>
    <p class="subtitle">Split the bill and add a tip in seconds.</p>

    <div class="field">
      <label for="bill">Bill amount ($)</label>
      <input id="bill" type="number" min="0" step="0.01" value="50" inputmode="decimal">
    </div>

    <div class="field">
      <label>Tip percentage</label>
      <div class="tips" id="tips">
        <button type="button" data-tip="10">10%</button>
        <button type="button" data-tip="15" class="active">15%</button>
        <button type="button" data-tip="18">18%</button>
        <button type="button" data-tip="20">20%</button>
        <button type="button" data-tip="25">25%</button>
        <button type="button" data-tip="custom">Custom</button>
      </div>
    </div>

    <div class="field" id="customField" hidden>
      <label for="customTip">Custom tip (%)</label>
      <input id="customTip" type="number" min="0" step="0.1" value="15" inputmode="decimal">
    </div>

    <div class="field">
      <label for="people">Number of people</label>
      <input id="people" type="number" min="1" step="1" value="2" inputmode="numeric">
    </div>

    <div class="results">
      <div class="row"><span>Tip</span><strong id="tipAmount">$0.00</strong></div>
      <div class="row"><span>Total</span><strong id="total">$0.00</strong></div>
      <div class="row"><span>Per person</span><strong id="perPerson">$0.00</strong></div>
    </div>
    <div class="error" id="error"></div>
  </main>

  <script>
    const billInput = document.getElementById("bill");
    const peopleInput = document.getElementById("people");
    const customTipInput = document.getElementById("customTip");
    const customField = document.getElementById("customField");
    const tipAmountEl = document.getElementById("tipAmount");
    const totalEl = document.getElementById("total");
    const perPersonEl = document.getElementById("perPerson");
    const errorEl = document.getElementById("error");
    const tipButtons = document.querySelectorAll("#tips button");

    let tipPercent = 15;

    function money(n) {
      return "$" + n.toFixed(2);
    }

    function calculate() {
      const bill = Number(billInput.value);
      const people = Number(peopleInput.value);
      const tip = customField.hidden ? tipPercent : Number(customTipInput.value);

      if (!Number.isFinite(bill) || bill < 0) {
        errorEl.textContent = "Enter a valid bill amount.";
        return;
      }
      if (!Number.isFinite(tip) || tip < 0) {
        errorEl.textContent = "Enter a valid tip percentage.";
        return;
      }
      if (!Number.isInteger(people) || people < 1) {
        errorEl.textContent = "People must be a whole number of at least 1.";
        return;
      }

      errorEl.textContent = "";
      const tipAmount = bill * (tip / 100);
      const total = bill + tipAmount;
      tipAmountEl.textContent = money(tipAmount);
      totalEl.textContent = money(total);
      perPersonEl.textContent = money(total / people);
    }

    tipButtons.forEach((button) => {
      button.addEventListener("click", () => {
        tipButtons.forEach((b) => b.classList.remove("active"));
        button.classList.add("active");
        if (button.dataset.tip === "custom") {
          customField.hidden = false;
        } else {
          customField.hidden = true;
          tipPercent = Number(button.dataset.tip);
        }
        calculate();
      });
    });

    [billInput, peopleInput, customTipInput].forEach((input) => {
      input.addEventListener("input", calculate);
    });

    const themeToggle = document.getElementById("themeToggle");
    const THEME_KEY = "tip-calculator-theme";

    function preferredTheme() {
      const saved = localStorage.getItem(THEME_KEY);
      if (saved === "light" || saved === "dark") return saved;
      return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      const next = theme === "dark" ? "light" : "dark";
      themeToggle.setAttribute("aria-label", "Switch to " + next + " mode");
      themeToggle.setAttribute("aria-pressed", String(theme === "dark"));
    }

    applyTheme(preferredTheme());
    themeToggle.addEventListener("click", () => {
      const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      localStorage.setItem(THEME_KEY, next);
      applyTheme(next);
    });

    calculate();
  </script>
</body>
</html>
